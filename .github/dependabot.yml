version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      cargo-versions:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['minor', 'patch']
      cargo-security:
        applies-to: security-updates
        patterns: ['*']
  # Separate manifests/lockfiles; these entries do not change release workflows.
  - package-ecosystem: cargo
    directory: /desktop
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    groups:
      desktop-versions:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['minor', 'patch']
      desktop-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: npm
    directory: /services/peerjs
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    groups:
      peerjs-versions:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['minor', 'patch']
      peerjs-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      github-actions-versions:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['minor', 'patch']
      github-actions-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: docker
    directory: /examples/demo
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      docker-versions:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['minor', 'patch']
      docker-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: docker-compose
    directories:
      - /deploy/services
      - /deploy/monitoring
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production-images:
        patterns: ['*']
        update-types: ['minor', 'patch']
  - package-ecosystem: docker
    directories:
      - /deploy/services/caddy
      - /services/peerjs
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      service-base-images:
        patterns: ['*']
        update-types: ['minor', 'patch']
  - package-ecosystem: gomod
    directory: /deploy/services/caddy
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      caddy-build:
        patterns: ['*']
        update-types: ['minor', 'patch']
