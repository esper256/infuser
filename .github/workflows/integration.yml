name: Docker and Caddy integration (manual)

on:
  workflow_dispatch:
    inputs:
      lifecycle_rounds:
        description: 'Wake/serve/sleep cycles (2–100; 20 for a longer run)'
        default: '2'
        type: string

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable (2026-11-15)
      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
      - name: Build the isolated demo image
        run: docker build -f examples/demo/Dockerfile -t infuser-demo .
      - name: Docker lifecycle journey
        env:
          INFUSER_TEST_ROUNDS: ${{ inputs.lifecycle_rounds }}
        run: |
          INFUSER_TEST_IMAGE=$(docker image inspect infuser-demo --format '{{.Id}}') \
            cargo test --locked --test docker_journey -- --ignored --nocapture
      - name: Persistent-world and image snapshot
        run: |
          cargo test --locked --test backup_docker_journey --no-run --message-format=json > "$RUNNER_TEMP/backup-build.jsonl"
          binary=$(jq -r 'select(.target.name == "backup_docker_journey" and .executable != null) | .executable' "$RUNNER_TEMP/backup-build.jsonl")
          sudo env INFUSER_TEST_IMAGE="$(docker image inspect infuser-demo --format '{{.Id}}')" \
            "$binary" --ignored --nocapture
      - name: Encrypted backup and restored-game journey
        run: |
          curl --fail --location --output "$RUNNER_TEMP/restic.bz2" https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_amd64.bz2
          curl --fail --location --output "$RUNNER_TEMP/restic-sums" https://github.com/restic/restic/releases/download/v0.19.1/SHA256SUMS
          expected=$(awk '$2 == "restic_0.19.1_linux_amd64.bz2" {print $1}' "$RUNNER_TEMP/restic-sums")
          test -n "$expected"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/restic.bz2" | sha256sum --check
          bunzip2 "$RUNNER_TEMP/restic.bz2"
          chmod +x "$RUNNER_TEMP/restic"
          INFUSER_TEST_RESTIC="$RUNNER_TEMP/restic" cargo test --locked --test backup_journey -- --ignored --nocapture
      - name: Extract Caddy 2.10.2
        if: ${{ !cancelled() }}
        run: |
          docker pull caddy:2.10.2
          container=$(docker create caddy:2.10.2)
          trap 'docker rm "$container"' EXIT
          docker cp "$container:/usr/bin/caddy" "$RUNNER_TEMP/caddy"
          chmod +x "$RUNNER_TEMP/caddy"
          "$RUNNER_TEMP/caddy" version
      - name: Managed Node packaging and two-player journey
        if: ${{ !cancelled() }}
        run: |
          docker pull node:24-bookworm-slim
          INFUSER_NODE_TEST_IMAGE=$(docker image inspect node:24-bookworm-slim --format '{{index .RepoDigests 0}}') \
            cargo test --locked --test node_packaging_docker -- --ignored --nocapture
      - name: Caddy authenticated web journey
        if: ${{ !cancelled() }}
        run: |
          CADDY_BIN="$RUNNER_TEMP/caddy" \
            cargo test --locked --test web_journey -- --ignored --nocapture
