name: Merge owner PRs

on:
  schedule:
    - cron: '3/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Inspect candidates without merging or dispatching releases
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: owner-auto-merge
  cancel-in-progress: false

jobs:
  merge:
    # Explicit activation/kill switch; never run privileged code from a PR ref.
    if: >-
      github.repository == 'esper256/infuser' &&
      github.ref == 'refs/heads/main' &&
      (vars.OWNER_AUTO_MERGE == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.dry_run))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        with:
          script: |
            const { run } = require('./.github/scripts/auto-merge.cjs');
            await run({ github, context, core, dryRun: process.env.DRY_RUN !== 'false' });
