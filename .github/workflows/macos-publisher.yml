name: Mac publisher release

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

# One daily batch, or an explicit manual build. Never cancel a running pair.
concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    if: >-
      github.repository == 'esper256/infuser' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.plan.outputs.build }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Select published commit and compare Mac inputs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/mac-release-plan.cjs

  macos-publisher:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    env:
      INFUSER_BUILD_SHA: ${{ needs.plan.outputs.commit }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.INFUSER_BUILD_SHA }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Mac publisher
        run: cargo build --locked --release --bin infuser-publisher
      - name: Connect, publish, and update using the release executable
        run: INFUSER_PUBLISHER_BIN="$PWD/target/release/infuser-publisher" cargo test --locked --test publisher_journey
      - name: Package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          cp target/release/infuser-publisher "dist/infuser-macos-$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: infuser-macos-${{ matrix.arch }}
          path: dist/infuser-macos-${{ matrix.arch }}
          retention-days: 3

  release:
    needs: [plan, macos-publisher]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      INFUSER_BUILD_SHA: ${{ needs.plan.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Tooling comes from the trusted workflow commit, never an untrusted PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: infuser-macos-*
          path: dist
          merge-multiple: true
      - name: Publish complete Mac pair without changing latest
        run: node .github/scripts/publish-release.cjs macos
