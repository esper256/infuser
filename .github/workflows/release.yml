name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Development keeps moving; superseded runs don't build a backlog.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      INFUSER_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Fast journeys
        run: cargo test --locked
      - name: Fast SDK journeys
        run: |
          mapfile -t tests < <(rg --files tests -g '*_sdk.mjs' -g '*theme*.mjs' -g '*theme*.js')
          node --test "${tests[@]}"
      - name: Build native binary
        run: cargo build --locked --release --bin infuser
      - name: Package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          cp target/release/infuser "dist/infuser-linux-$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: infuser-linux-${{ matrix.arch }}
          path: dist/infuser-linux-${{ matrix.arch }}
          retention-days: 3

  macos-publisher:
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      INFUSER_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Mac publisher
        run: cargo build --locked --release --bin infuser-publisher
      - name: Connect, publish, and update using the release executable
        run: INFUSER_PUBLISHER_BIN="$PWD/target/release/infuser-publisher" cargo test --locked --test publisher_journey
      - name: Package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          cp target/release/infuser-publisher "dist/infuser-macos-$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: infuser-macos-${{ matrix.arch }}
          path: dist/infuser-macos-${{ matrix.arch }}
          retention-days: 3

  desktop:
    env:
      INFUSER_BUILD_SHA: ${{ github.sha }}
    strategy:
      matrix:
        runner: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Desktop journeys
        run: cargo test --manifest-path desktop/Cargo.toml --locked
      - name: Build companion
        run: cargo build --manifest-path desktop/Cargo.toml --locked --release
      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DBuild=$env:GITHUB_SHA" desktop/packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item desktop/target/release/infuser-desktop.exe dist/infuser-play-windows-x86_64.exe
      - name: Package Linux installer
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak
          mkdir -p dist
          sh desktop/packaging/build-flatpak.sh desktop/target/release/infuser-desktop "$PWD/dist/Infuser-Play.flatpak"
          cp desktop/target/release/infuser-desktop dist/infuser-play-linux-x86_64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: infuser-desktop-${{ runner.os }}
          path: dist/*
          retention-days: 3

  release:
    if: github.ref == 'refs/heads/main'
    needs: [build, macos-publisher, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: infuser-*
          path: dist
          merge-multiple: true
      - name: Publish the latest passing commit
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo 'A newer commit exists; skipping this release.'
            exit 0
          fi
          tag="build-$GITHUB_SHA"
          if gh release view "$tag" --json isDraft --jq .isDraft > /tmp/infuser-draft 2>/dev/null; then
            if [ "$(cat /tmp/infuser-draft)" = false ]; then
              echo 'This immutable release is already published.'
              exit 0
            fi
          else
            printf 'Automated passing build.\n\n%s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > /tmp/infuser-release-notes
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Build ${GITHUB_SHA:0:8}" --notes-file /tmp/infuser-release-notes
          fi
          amd64=$(sha256sum dist/infuser-linux-amd64 | cut -d ' ' -f 1)
          arm64=$(sha256sum dist/infuser-linux-arm64 | cut -d ' ' -f 1)
          mac_amd64=$(sha256sum dist/infuser-macos-amd64 | cut -d ' ' -f 1)
          mac_arm64=$(sha256sum dist/infuser-macos-arm64 | cut -d ' ' -f 1)
          jq -n --arg commit "$GITHUB_SHA" --arg amd64 "$amd64" --arg arm64 "$arm64" --arg mac_amd64 "$mac_amd64" --arg mac_arm64 "$mac_arm64" \
            '{commit:$commit,artifacts:{"linux-amd64":{file:"infuser-linux-amd64",sha256:$amd64},"linux-arm64":{file:"infuser-linux-arm64",sha256:$arm64},"macos-amd64":{file:"infuser-macos-amd64",sha256:$mac_amd64},"macos-arm64":{file:"infuser-macos-arm64",sha256:$mac_arm64}}}' > dist/release.json
          play_linux=$(sha256sum dist/infuser-play-linux-x86_64 | cut -d ' ' -f 1)
          play_windows=$(sha256sum dist/infuser-play-windows-x86_64.exe | cut -d ' ' -f 1)
          jq -n --arg commit "$GITHUB_SHA" --arg linux "$play_linux" --arg windows "$play_windows" \
            '{protocol:1,commit:$commit,artifacts:{"linux-x86_64":{file:"infuser-play-linux-x86_64",sha256:$linux},"windows-x86_64":{file:"infuser-play-windows-x86_64.exe",sha256:$windows}}}' > dist/play-release.json
          # Retain aliases for existing bookmarks and cached website install links.
          cp dist/Infuser-Play-Setup.exe dist/Infuser-Setup.exe
          cp dist/Infuser-Play.flatpak dist/Infuser.flatpak
          (cd dist && sha256sum infuser-linux-* infuser-macos-* infuser-play-* Infuser-Play-Setup.exe Infuser-Play.flatpak Infuser-Setup.exe Infuser.flatpak > SHA256SUMS)
          gh release upload "$tag" dist/infuser-linux-amd64 dist/infuser-linux-arm64 dist/infuser-macos-amd64 dist/infuser-macos-arm64 dist/Infuser-Play-Setup.exe dist/Infuser-Play.flatpak dist/Infuser-Setup.exe dist/Infuser.flatpak dist/SHA256SUMS dist/release.json dist/play-release.json dist/infuser-play-linux-x86_64 dist/infuser-play-windows-x86_64.exe --clobber
          head=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo 'Superseded while uploading; leaving this draft unpublished.'
            exit 0
          fi
          gh release edit "$tag" --draft=false --latest
