name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Finish running builds; retain only the newest pending run during bursts.
concurrency:
  group: release-server-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      INFUSER_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Fast journeys
        run: cargo test --locked
      - name: Fast SDK journeys
        run: |
          mapfile -t tests < <(rg --files tests -g '*_sdk.mjs' -g '*theme*.mjs' -g '*theme*.js' -g 'voice_chimes.mjs' -g 'voice_audio.mjs')
          node --test "${tests[@]}"
      - name: Changelog tests
        run: node --test .github/scripts/changelog.test.cjs
      - name: Write the release changelog
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node .github/scripts/changelog.cjs CHANGELOG.json
      - name: Build native binary
        run: cargo build --locked --release --bin infuser
      - name: Package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          cp target/release/infuser "dist/infuser-linux-$ARCH"
          if [ "$ARCH" = amd64 ]; then cp CHANGELOG.json dist/changelog.json; fi
      # Both paths are files directly in dist/. The artifact root is that
      # directory, so download-artifact with merge-multiple writes
      # dist/changelog.json and not dist/dist/changelog.json. Arm builds
      # repeat the binary path because they do not ship the changelog.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: infuser-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/infuser-linux-${{ matrix.arch }}
            ${{ matrix.arch == 'amd64' && 'dist/changelog.json' || 'dist/infuser-linux-arm64' }}
          retention-days: 3

  desktop:
    env:
      INFUSER_BUILD_SHA: ${{ github.sha }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Desktop journeys
        run: cargo test --manifest-path desktop/Cargo.toml --locked
      - name: Build companion
        run: cargo build --manifest-path desktop/Cargo.toml --locked --release
      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DBuild=$env:GITHUB_SHA" desktop/packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item desktop/target/release/infuser-desktop.exe dist/infuser-play-windows-x86_64.exe
      - name: Package Linux installer
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak
          mkdir -p dist
          sh desktop/packaging/build-flatpak.sh desktop/target/release/infuser-desktop "$PWD/dist/Infuser-Play.flatpak"
          cp desktop/target/release/infuser-desktop dist/infuser-play-linux-x86_64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: infuser-desktop-${{ runner.os }}
          path: dist/*
          retention-days: 3

  release:
    if: github.ref == 'refs/heads/main'
    needs: [build, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: infuser-*
          path: dist
          merge-multiple: true
      - name: Changelog is beside the merged release files
        run: |
          test -f dist/changelog.json
          test ! -e dist/dist/changelog.json
          test ! -e dist/infuser-linux-amd64/changelog.json
      - name: Publish complete server and Play release without rolling back latest
        run: node .github/scripts/publish-release.cjs server
