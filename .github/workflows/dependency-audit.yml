name: Dependency audit (advisory)

on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Standalone reporting, never a release prerequisite; no issue/PR spam.
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable (2026-11-15)
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.23.0 --locked
      - name: Audit locked Rust dependencies
        id: audit
        run: |
          set -o pipefail
          failed=0
          cargo audit --color never 2>&1 | tee "$RUNNER_TEMP/dependency-audit.txt" || failed=1
          cargo audit --file desktop/Cargo.lock --color never 2>&1 | tee -a "$RUNNER_TEMP/dependency-audit.txt" || failed=1
          exit "$failed"
      - name: Publish advisory report
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          {
            echo '## Dependency audit (advisory)'
            printf 'Audit step outcome: %s\n\n' "$AUDIT_OUTCOME"
            echo 'This report does not gate releases. Review findings and audit infrastructure errors.'
            echo '```text'
            if [ -f "$RUNNER_TEMP/dependency-audit.txt" ]; then
              cat "$RUNNER_TEMP/dependency-audit.txt"
            else
              echo 'Audit did not run; inspect the setup logs.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$AUDIT_OUTCOME" != success ]; then
            echo '::warning::Dependency audit needs attention; see the job summary and logs.'
          fi
