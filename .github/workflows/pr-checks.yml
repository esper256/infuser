name: PR checks (advisory)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Advisory feedback only; no approval gate or release dependency.
jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        check: [fast-tests, formatting, clippy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable (2026-11-15)
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Fast Rust journeys
        if: matrix.check == 'fast-tests'
        run: cargo test --locked
      - name: Fast SDK and theme journeys
        if: ${{ !cancelled() && matrix.check == 'fast-tests' }}
        run: node --test tests/*_sdk.mjs tests/themes.mjs tests/voice_chimes.mjs
      - name: Rust formatting
        if: matrix.check == 'formatting'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: matrix.check == 'clippy'
        run: cargo clippy --locked --all-targets -- -D warnings

  action-compatibility:
    name: Action compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const assert = require('node:assert/strict');
            const { run } = require('./.github/scripts/auto-merge.cjs');
            assert.equal(typeof run, 'function');
            assert.equal(typeof github.rest.pulls.list, 'function');
      - name: Release publication policy tests
        run: node --test .github/scripts/publish-release.test.cjs .github/scripts/mac-release-plan.test.cjs
      - name: Create artifact fixture
        run: |
          mkdir -p fixture
          printf 'Infuser artifact compatibility\n' > fixture/binary
          (cd fixture && sha256sum binary > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: infuser-action-smoke
          path: fixture/*
          retention-days: 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: infuser-action-smoke
          path: restored
          merge-multiple: true
      - name: Verify downloaded layout and bytes
        run: cd restored && sha256sum --check SHA256SUMS
