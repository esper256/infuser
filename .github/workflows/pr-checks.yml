name: PR checks (advisory)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Advisory feedback only; no approval gate or release dependency.
jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        check: [fast-tests, formatting, clippy, turn-crate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable (2026-11-15)
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Chromium for the Groups journey
        if: matrix.check == 'fast-tests'
        run: |
          npm ci --prefix services/peerjs
          services/peerjs/node_modules/.bin/playwright install --with-deps chromium
      - name: Fast Rust journeys
        if: matrix.check == 'fast-tests'
        env:
          INFUSER_GROUP_BROWSER_NODE: node
        run: cargo test --locked
      - name: Fast SDK and theme journeys
        if: ${{ !cancelled() && matrix.check == 'fast-tests' }}
        run: node --test tests/*_sdk.mjs tests/themes.mjs tests/voice_chimes.mjs tests/voice_audio.mjs tests/chat_reads.mjs tests/leak_soak.mjs
      - name: Rust formatting
        if: matrix.check == 'formatting'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: matrix.check == 'clippy'
        run: cargo clippy --locked --all-targets --features fixtures -- -D warnings
      - name: Vendored TURN suite
        if: matrix.check == 'turn-crate'
        run: cargo test --manifest-path vendor/turn/Cargo.toml -- --skip test_client_with_stun_send_binding_request --skip test_client_with_stun_send_binding_request_to_parallel && cargo test --manifest-path vendor/turn/Cargo.toml test_client_with_stun_send_binding_request_to_timeout

  gamepad-journey:
    name: Library controller journey
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --prefix services/peerjs
      - run: services/peerjs/node_modules/.bin/playwright install --with-deps chromium
      - run: node tests/gamepad_layout_journey.mjs
        env:
          INFUSER_PLAYWRIGHT: ${{ github.workspace }}/services/peerjs/node_modules/playwright/index.mjs
      - run: node tests/library_detail_journey.mjs
        env:
          INFUSER_PLAYWRIGHT: ${{ github.workspace }}/services/peerjs/node_modules/playwright/index.mjs

  action-compatibility:
    name: Action compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const assert = require('node:assert/strict');
            const { run } = require('./.github/scripts/auto-merge.cjs');
            assert.equal(typeof run, 'function');
            assert.equal(typeof github.rest.pulls.list, 'function');
      - name: Release publication policy tests
        run: node --test .github/scripts/publish-release.test.cjs .github/scripts/mac-release-plan.test.cjs .github/scripts/changelog.test.cjs
