[package]
name = "infuser-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.89"

[dependencies]
anyhow = "1"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }
infuser-native-protocol = { path = "../native-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.11"
rand = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }
directories = "6"
open = "5"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
strip = true

# Stays its own workspace. The controller workspace vendors TURN.
[workspace]
