[package]
name = "infuser"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A small private game hosting controller"
default-run = "infuser"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
hmac = "0.12"
sha1 = "0.10"
axum = "0.8"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
tower = { version = "0.5", features = ["util", "limit"] }
tower-http = { version = "0.6", features = ["fs"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "net", "signal", "sync", "io-util"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image-webp = { version = "0.2", default-features = false }
infuser-native-protocol = { path = "native-protocol" }
zip = { version = "4", default-features = false, features = ["deflate"] }
tempfile = "3"

[dev-dependencies]
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[profile.release]
lto = "thin"
strip = true
