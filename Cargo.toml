[package]
name = "infuser"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.89"
description = "A small private game hosting controller"
default-run = "infuser"

[dependencies]
anyhow = "1"
glob = "0.3"
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-zoneinfo"] }
async-trait = "0.1"
base64 = "0.23"
hmac = "0.13"
sha1 = "0.11"
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = "0.30"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
rusqlite = { version = "0.42", default-features = false, features = ["bundled", "cache", "fallible_uint", "blob", "backup"] }
tower = { version = "0.5", features = ["util", "limit"] }
tower-http = { version = "0.7", features = ["fs"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "net", "signal", "sync", "io-util", "fs"] }
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image-webp = { version = "0.2", default-features = false }
image = { version = "0.25", default-features = false }
webp = { version = "0.3.1", default-features = false }
infuser-native-protocol = { path = "native-protocol" }
zip = { version = "9", default-features = false, features = ["deflate"] }
tempfile = "3"
ring = "0.17.14"
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
brotli = "9.1.3"

[dev-dependencies]
brotli = "9.1.3"
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[profile.release]
lto = "thin"
strip = true
