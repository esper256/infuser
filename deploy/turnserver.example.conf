# PRIVATE installed copy: replace all example values and protect with mode 0640.
listening-port=8700
listening-ip=REPLACE_PRIVATE_IP
relay-ip=REPLACE_PRIVATE_IP
external-ip=REPLACE_PUBLIC_IP/REPLACE_PRIVATE_IP
min-port=8800
max-port=8899
realm=games.example.com
server-name=games.example.com
fingerprint
use-auth-secret
static-auth-secret=REPLACE_WITH_RANDOM_SERVER_SECRET
no-tls
no-dtls
no-cli
no-tcp-relay
no-multicast-peers
no-software-attribute
user-quota=16
total-quota=64
max-bps=524288
bps-capacity=8388608
stale-nonce=600
# Prevent an authenticated game from using the relay to probe private services.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
log-file=stdout
simple-log
pidfile=/tmp/turnserver.pid
