global:
  scrape_interval: 30s
  scrape_timeout: 10s
scrape_config_files:
  - /etc/prometheus/scrape.d/*.yml
scrape_configs:
  - job_name: host
    static_configs:
      - targets: ['127.0.0.1:9100']
        labels: {project: host}
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'infuser_.*'
        target_label: project
        replacement: infuser
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
        labels: {project: host}
  - job_name: grafana
    static_configs:
      - targets: ['127.0.0.1:3000']
        labels: {project: host}
  - job_name: website
    metrics_path: /probe
    params:
      module: [https]
    file_sd_configs:
      - files: [/etc/prometheus/targets.json]
    relabel_configs:
      - target_label: project
        replacement: infuser
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
