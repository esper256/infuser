# Run oauth2-proxy separately on loopback. Supply secrets through its environment:
# OAUTH2_PROXY_CLIENT_ID, OAUTH2_PROXY_CLIENT_SECRET, OAUTH2_PROXY_COOKIE_SECRET.
provider = "google"
http_address = "127.0.0.1:4180"
redirect_url = "https://games.example.com/oauth2/callback"
reverse_proxy = true
upstreams = ["static://202"]
scope = "openid email profile"
# Override OAuth2 Proxy's legacy approval_prompt=force default. Let shared-device
# players choose their account without forcing permission approval on every login.
prompt = "select_account"

# Google verifies identity; Infuser enforces each private group’s invitations.
email_domains = ["*"]
set_xauthrequest = true
# Required: successful /oauth2/auth responses supply X-Auth-Request-User
# (Google's stable subject) and X-Auth-Request-Email. Do not substitute email as User.

# Host-only: never send the Google session to a game subdomain.
cookie_name = "__Host-infuser_session"
cookie_path = "/"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
# Google verifies sign-in; Infuser does not use Google APIs. Keep a fixed seven-day
# session without OAuth tokens or refreshes. Enabling refresh would require a
# refresh token, which Google does not return on every sign-in.
cookie_expire = "168h"
cookie_refresh = "0s"
session_cookie_minimal = true
whitelist_domains = [".games.example.com"]
skip_provider_button = true
pass_access_token = false
pass_authorization_header = false
set_authorization_header = false
