---
- name: Assemble the explicitly owned file list
  ansible.builtin.set_fact:
    infuser_managed_files: []
    infuser_changed_components: []
- name: Select service units
  ansible.builtin.set_fact:
    infuser_managed_files: '{{ infuser_managed_files + [dict(src=infuser_source_dir + "/deploy/" + item, dest=infuser_systemd_dir + "/" + item, mode="0644", component="units", sensitive=false)] }}'
  loop: '{{ infuser_unit_files if infuser_manage_units else [] }}'
- name: Select maintenance helpers
  ansible.builtin.set_fact:
    infuser_managed_files: '{{ infuser_managed_files + [dict(src=infuser_source_dir + "/deploy/" + item.src, dest=item.dest, mode=item.mode, component="units", sensitive=false)] }}'
  loop:
    - {src: infuser-logs, dest: /usr/local/bin/infuser-logs, mode: '0755'}
    - {src: host-maintenance-lock.sh, dest: '{{ infuser_libexec_dir }}/infuser-host-maintenance-lock', mode: '0755'}
    - {src: reboot-if-required.sh, dest: '{{ infuser_libexec_dir }}/infuser-reboot-if-required', mode: '0755'}
    - {src: maintenance-lock-update.conf, dest: '{{ infuser_systemd_dir }}/infuser-update.service.d/maintenance-lock.conf', mode: '0644'}
    - {src: maintenance-lock-backup.conf, dest: '{{ infuser_systemd_dir }}/infuser-backup.service.d/maintenance-lock.conf', mode: '0644'}
    - {src: 99-infuser-reboots, dest: /etc/apt/apt.conf.d/99-infuser-reboots, mode: '0644'}
  when: infuser_manage_units
- name: Select monitoring defaults without private inputs or other projects
  ansible.builtin.set_fact:
    infuser_managed_files: '{{ infuser_managed_files + [dict(src=infuser_source_dir + "/deploy/monitoring/" + item, dest=infuser_monitoring_dir + "/" + item, mode=("0755" if item.endswith(".sh") else "0644"), component="monitoring", sensitive=false)] }}'
  loop: '{{ infuser_monitoring_files if infuser_manage_monitoring else [] }}'
- name: Select shared-service image definitions
  ansible.builtin.set_fact:
    infuser_managed_files: '{{ infuser_managed_files + [dict(src=infuser_source_dir + "/deploy/services/" + item, dest=infuser_service_sources_dir + "/" + item, mode="0644", component="services", sensitive=false)] }}'
  loop: '{{ infuser_service_source_files if infuser_manage_service_sources else [] }}'
- name: Select private file overrides
  ansible.builtin.set_fact:
    infuser_managed_files: '{{ (infuser_managed_files | rejectattr("dest", "in", infuser_extra_files | map(attribute="dest") | list) | list) + infuser_extra_files }}'
  no_log: true
- name: Require explicit destinations and components
  ansible.builtin.assert:
    that:
      - item.dest.startswith('/')
      - item.component in ['units', 'monitoring', 'services', 'caddy']
      - item.src is defined
      - item.mode is defined
  loop: '{{ infuser_managed_files }}'
  loop_control:
    label: '{{ item.dest }}'
  no_log: true
- name: Reject duplicate destinations
  ansible.builtin.assert:
    that: (infuser_managed_files | map(attribute='dest') | unique | length) == (infuser_managed_files | length)
- name: Validate fixed Compose stack selections
  ansible.builtin.assert:
    that:
      - item.services | length > 0
      - item.files | length > 0
      - item.components | length > 0
      - item.project_src.startswith('/')
  loop: '{{ infuser_stacks }}'
  loop_control:
    label: '{{ item.name }}'
- name: Validate service and timer source files before installing any changes
  ansible.builtin.command:
    argv: [systemd-analyze, verify, --man=no, '{{ item.src }}']
  changed_when: false
  check_mode: false
  loop: '{{ infuser_managed_files }}'
  when: item.dest.endswith('.service') or item.dest.endswith('.timer')
  no_log: true
- name: Install owned configuration files with timestamped rollback copies
  ansible.builtin.include_tasks: file.yml
  loop: '{{ infuser_managed_files }}'
  loop_control:
    loop_var: managed_file
    label: '{{ managed_file.dest }}'
- name: Render the optional Infuser Caddy fragment
  when: infuser_caddy_domain | length > 0
  block:
    - name: Validate the configured domain
      ansible.builtin.assert:
        that:
          - infuser_caddy_domain is match('^[a-z0-9][a-z0-9.-]+[a-z0-9]$')
          - '"/etc/caddy/sites-enabled/infuser.caddy" not in (infuser_extra_files | map(attribute="dest") | list)'
    - name: Install only the Infuser site fragment
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.file', infuser_source_dir + '/deploy/Caddyfile.example') | replace('example.com', infuser_caddy_domain) }}\n"
        dest: /etc/caddy/sites-enabled/infuser.caddy
        owner: root
        group: root
        mode: '0640'
        backup: true
      register: caddy_fragment
      diff: false
      no_log: true
    - name: Record Caddy changes
      ansible.builtin.set_fact:
        infuser_changed_components: '{{ (infuser_changed_components | default([])) + ["caddy"] }}'
      when: caddy_fragment.changed
- name: Render private notification rules when configured
  ansible.builtin.include_tasks: notifications.yml
  when: infuser_manage_monitoring
- name: Show affected components
  ansible.builtin.debug:
    msg: 'Changed components: {{ infuser_changed_components | default([]) | unique | join(", ") | default("none", true) }}. Apply reconciles only inventory-selected services.'
- name: Inspect fixed Compose stacks in preview mode
  community.docker.docker_compose_v2:
    project_src: '{{ item.project_src }}'
    project_name: '{{ item.name }}'
    files: '{{ item.files }}'
    env_files: '{{ item.env_files | default(omit) }}'
    services: '{{ item.services }}'
    dependencies: false
    remove_orphans: false
    remove_volumes: false
    state: present
    build: never
  loop: '{{ infuser_stacks }}'
  register: stack_previews
  check_mode: true
  no_log: true
  when: ansible_check_mode
- name: Summarize installed Compose definitions without private environment values
  ansible.builtin.debug:
    msg: '{{ item.item.name }}: installed stack predicts change={{ item.changed }}. File changes above may require additional recreation.'
  loop: '{{ stack_previews.results | default([]) }}'
  loop_control:
    label: '{{ item.item.name }}'
  when: ansible_check_mode
- name: Validate installed candidate configuration before service changes
  ansible.builtin.command:
    argv: '{{ item }}'
  changed_when: false
  loop: '{{ infuser_validators }}'
  no_log: true
  when: not ansible_check_mode
- name: Reconcile services only during guarded apply
  ansible.builtin.include_tasks: services.yml
  when: not ansible_check_mode
