# PRIVATE installed copy: substitute the public IP and a dedicated key/secret.
# Bind all interfaces INSIDE the bridge container; publish its API on host loopback only.
port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
  node_ip: REPLACE_WITH_PUBLIC_IP
keys:
  REPLACE_WITH_API_KEY: REPLACE_WITH_RANDOM_SECRET
room:
  empty_timeout: 30
  departure_timeout: 10
logging:
  level: warn
