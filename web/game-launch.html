<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opening your game · Infuser</title><style>body{background:#122429;color:#ecfff7;font:20px system-ui;display:grid;place-items:center;min-height:90vh}main{max-width:28em;padding:2em}a{color:#aff5cb}</style><main><h1>Opening your world…</h1><p id="status">Getting your game ready.</p></main><script>
(async () => {
  const play = '/_infuser/play' + location.search;
  const fragment = new URLSearchParams(location.hash.slice(1));
  const token = fragment.get('infuser');
  history.replaceState(null, '', play);
  try {
    if (!token) throw Error('Open this game using Play in the Infuser Library.');
    const response = await fetch('/_infuser/session', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({token})
    });
    if (!response.ok) throw Error('This launch link has expired. Press Play in the Library again.');
    try {
      const layouts = fragment.get('pad-layouts');
      if (layouts && layouts.length <= 32768) sessionStorage.setItem('infuser.launch.pad-layouts', layouts);
      else sessionStorage.removeItem('infuser.launch.pad-layouts');
    } catch {} // Storage restrictions must not block launch.
    location.replace(play);
  } catch (error) {
    document.getElementById('status').textContent = error.message;
  }
})();
</script></html>
