<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opening your game · Infuser</title><style>body{background:#122429;color:#ecfff7;font:20px system-ui;display:grid;place-items:center;min-height:90vh}main{max-width:28em;padding:2em}a{color:#aff5cb}</style><main><h1>Opening your world…</h1><p id="status">Getting your game ready.</p></main><script>
(async()=>{const token=new URLSearchParams(location.hash.slice(1)).get('infuser');history.replaceState(null,'','/');try{if(!token)throw Error('Open this game using Play in the Infuser clubhouse.');const r=await fetch('/_infuser/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});if(!r.ok)throw Error('This launch link has expired. Press Play in the clubhouse again.');location.replace('/')}catch(e){document.getElementById('status').textContent=e.message}})();
</script></html>
